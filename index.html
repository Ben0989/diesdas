<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kreisverkehr – 4x VZ 205 + VZ 215 – 5 cm</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#ededed;color:#111}
.toolbar{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #ccc}
button{border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;padding:10px 18px;cursor:pointer}
.note{font-size:13px;color:#444}
.sheet{width:210mm;height:297mm;margin:12px auto;background:#fff;padding:18mm 20mm;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12mm 18mm;overflow:hidden}
.set{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8mm;min-height:115mm}
.signbox{width:50mm;height:50mm;display:flex;align-items:center;justify-content:center}
.vz205{width:50mm;height:auto;max-height:50mm;display:block}
.vz215{width:50mm;height:50mm;display:block}
@media(max-width:850px){.sheet{zoom:.48;margin:10px auto}.toolbar{flex-wrap:wrap}}
@media print{
 body{background:#fff}
 .toolbar{display:none}
 .sheet{margin:0;width:210mm;height:297mm;padding:18mm 20mm;box-shadow:none}
 @page{size:A4 portrait;margin:0}
}
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">Drucken</button>
  <span class="note">Beim Drucken: 100 % / Tatsächliche Größe. Alle Zeichen sind 5 cm breit; VZ 215 hat exakt 5 cm Durchmesser.</span>
</div>
<main class="sheet">
  <section class="set">
    <div class="signbox"><img class="vz205" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Zeichen_205_-_Vorfahrt_gew%C3%A4hren%21_StVO_1970.svg" alt="VZ 205 Vorfahrt gewähren"></div>
    <div class="signbox"><img class="vz215" src="https://upload.wikimedia.org/wikipedia/commons/7/74/Zeichen_215_-_Kreisverkehr%2C_StVO_2000.svg" alt="VZ 215 Kreisverkehr"></div>
  </section>
  <section class="set">
    <div class="signbox"><img class="vz205" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Zeichen_205_-_Vorfahrt_gew%C3%A4hren%21_StVO_1970.svg" alt="VZ 205 Vorfahrt gewähren"></div>
    <div class="signbox"><img class="vz215" src="https://upload.wikimedia.org/wikipedia/commons/7/74/Zeichen_215_-_Kreisverkehr%2C_StVO_2000.svg" alt="VZ 215 Kreisverkehr"></div>
  </section>
  <section class="set">
    <div class="signbox"><img class="vz205" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Zeichen_205_-_Vorfahrt_gew%C3%A4hren%21_StVO_1970.svg" alt="VZ 205 Vorfahrt gewähren"></div>
    <div class="signbox"><img class="vz215" src="https://upload.wikimedia.org/wikipedia/commons/7/74/Zeichen_215_-_Kreisverkehr%2C_StVO_2000.svg" alt="VZ 215 Kreisverkehr"></div>
  </section>
  <section class="set">
    <div class="signbox"><img class="vz205" src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Zeichen_205_-_Vorfahrt_gew%C3%A4hren%21_StVO_1970.svg" alt="VZ 205 Vorfahrt gewähren"></div>
    <div class="signbox"><img class="vz215" src="https://upload.wikimedia.org/wikipedia/commons/7/74/Zeichen_215_-_Kreisverkehr%2C_StVO_2000.svg" alt="VZ 215 Kreisverkehr"></div>
  </section>
</main>
</body>
</html>
